apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-sre-app
  namespace: banking-sre
  labels:
    app: banking-sre-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-sre-app
  template:
    metadata:
      labels:
        app: banking-sre-app
    spec:
      containers:
      - name: banking-sre-app
        image: nginx:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
