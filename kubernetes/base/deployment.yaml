apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-sre-app
  namespace: banking-sre
  labels:
    app: banking-sre-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-sre-app
  template:
    metadata:
      labels:
        app: banking-sre-app
    spec:
      containers:
        - name: banking-sre-app
          image: 271357389785.dkr.ecr.us-east-1.amazonaws.com/banking-sre-dev-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
